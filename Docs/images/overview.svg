<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <!-- ============ Server ============ -->
  <rect x="20" y="20" width="330" height="300" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="44" y="58" font-size="24" font-weight="700" fill="#0f172a">Server</text>
  <text x="44" y="84" font-size="16" fill="#475569">FreeRTOS POSIX · C</text>
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="2">
    <rect x="44" y="105" width="282" height="46" rx="10"/>
    <rect x="44" y="175" width="282" height="46" rx="10"/>
    <rect x="44" y="245" width="282" height="46" rx="10"/>
  </g>
  <g font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <text x="185" y="134">Event Generator task</text>
    <text x="185" y="204">UDP TX task</text>
    <text x="185" y="274">UDP RX task</text>
  </g>
  <line x1="185" y1="153" x2="185" y2="171" stroke="#334155" stroke-width="2" marker-end="url(#aDark)"/>

  <!-- ============ SQLite ============ -->
  <rect x="20" y="345" width="330" height="85" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="185" y="380" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">SQLite</text>
  <text x="185" y="410" font-size="16" fill="#475569" text-anchor="middle">every event and its final status</text>
  <line x1="120" y1="322" x2="120" y2="341" stroke="#334155" stroke-width="2.5" marker-end="url(#aDark)"/>
  <text x="134" y="337" font-size="14" font-weight="600" fill="#334155">insert / update</text>

  <!-- ============ Client ============ -->
  <rect x="470" y="20" width="630" height="410" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="494" y="58" font-size="24" font-weight="700" fill="#0f172a">Client</text>
  <text x="494" y="84" font-size="16" fill="#475569">FreeRTOS POSIX · C · 6 departments</text>

  <g fill="#ffffff" stroke="#15803d" stroke-width="2">
    <rect x="495" y="100" width="170" height="56" rx="10"/>
    <rect x="700" y="100" width="170" height="56" rx="10"/>
    <rect x="495" y="195" width="280" height="95" rx="10"/>
    <rect x="820" y="195" width="255" height="95" rx="10"/>
  </g>
  <rect x="495" y="330" width="280" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="820" y="330" width="255" height="80" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="580" y="134" font-size="18" font-weight="700" fill="#14532d">UDP RX task</text>
    <text x="785" y="134" font-size="18" font-weight="700" fill="#14532d">Dispatcher</text>

    <text x="635" y="232" font-size="19" font-weight="700" fill="#14532d">Priority queues</text>
    <text x="635" y="260" font-size="15" fill="#475569">per department: high · medium · low</text>

    <text x="947" y="232" font-size="19" font-weight="700" fill="#14532d">Vehicle tasks</text>
    <text x="947" y="260" font-size="15" fill="#475569">one FreeRTOS task per vehicle</text>

    <text x="635" y="364" font-size="19" font-weight="700" fill="#991b1b">Fault Manager</text>
    <text x="635" y="390" font-size="15" fill="#475569">retries interrupted events</text>

    <text x="947" y="364" font-size="19" font-weight="700" fill="#5b21b6">Shift Managers</text>
    <text x="947" y="390" font-size="15" fill="#475569">vehicle breaks · event groups</text>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aDark)">
    <line x1="667" y1="128" x2="696" y2="128"/>
    <line x1="740" y1="158" x2="740" y2="191"/>
    <line x1="777" y1="242" x2="816" y2="242"/>
  </g>
  <!-- interrupted event -> fault manager -> back to queue -->
  <path d="M900,292 L900,310 L700,310 L700,326" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <path d="M495,370 L482,370 L482,176 L681,176 L681,134" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="560" y="171" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">retry</text>
  <!-- shift manager -> vehicles -->
  <line x1="1010" y1="328" x2="1010" y2="294" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>
  <!-- ============ UDP ============ -->
  <text x="410" y="80" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">UDP</text>
  <path d="M328,198 L410,198 L410,128 L491,128" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="418" y="172" font-size="13" font-weight="700" fill="#1d4ed8">EVENT</text>
  <line x1="468" y1="268" x2="330" y2="268" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="410" y="240" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">ACK,</text><text x="410" y="257" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">COMPLETION</text>

</svg>
