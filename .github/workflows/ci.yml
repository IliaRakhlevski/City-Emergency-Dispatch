# CI for City-Emergency-Dispatch (FreeRTOS POSIX port, runs as a Linux program).
#
# On every push to main and on every pull request:
#   1. Build: the application compiles with its Makefile.
#   2. End-to-end smoke test: client and server run together on this machine
#      (UDP over 127.0.0.1) for 30 seconds, are stopped with Ctrl+C (SIGINT),
#      and must exit with 0. The server statistics must show that events were
#      generated and acknowledged by the client.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e-smoke-test:
    name: Linux - build and end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15        # stop a stuck job instead of waiting up to 6 hours

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build
        run: make -j"$(nproc)"

      - name: End-to-end smoke test (client + server, 30 s)
        run: |
          BIN=./build/city_emergency_dispatch

          # 1. The client first: it opens the UDP socket and waits for events.
          $BIN -client > client.log 2>&1 &
          CLIENT=$!
          sleep 2

          # 2. The server: generates events and sends them to the client.
          $BIN -server > server.log 2>&1 &
          SERVER=$!
          sleep 30

          # 3. Both must still be running (no crash during the 30 seconds).
          kill -0 $SERVER || { echo "Server is not running"; exit 1; }
          kill -0 $CLIENT || { echo "Client is not running"; exit 1; }

          # 4. Stop like a user does: Ctrl+C, server first, then client.
          # ("&& ... || ..." keeps the exit code: the step shell stops on the first error)
          kill -INT $SERVER; wait $SERVER && SERVER_RC=0 || SERVER_RC=$?
          kill -INT $CLIENT; wait $CLIENT && CLIENT_RC=0 || CLIENT_RC=$?

          echo "----- server.log (last 30 lines) -----"; tail -n 30 server.log
          echo "----- client.log (last 30 lines) -----"; tail -n 30 client.log

          # 5. Clean shutdown.
          [ "$SERVER_RC" -eq 0 ] || { echo "Server exit code $SERVER_RC"; exit 1; }
          [ "$CLIENT_RC" -eq 0 ] || { echo "Client exit code $CLIENT_RC"; exit 1; }

          # 6. Events really went through: generated by the server, ACKed by the client.
          GENERATED=$(grep -oP 'Generated\s*:\s*\K[0-9]+' server.log | tail -1)
          ACKS=$(grep -oP 'ACKs\s*:\s*\K[0-9]+' server.log | tail -1)
          echo "Generated=$GENERATED ACKs=$ACKS"
          [ "${GENERATED:-0}" -gt 0 ] || { echo "No events were generated"; exit 1; }
          [ "${ACKS:-0}" -gt 0 ]      || { echo "No ACKs from the client"; exit 1; }
